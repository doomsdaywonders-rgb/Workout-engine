<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENGINEERED PHYSIQUE | TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gymDark: '#09090b', // Deep zinc
                        gymPanel: '#18181b',
                        volt: '#eab308', // High energy yellow/orange
                        neonBlue: '#06b6d4'
                    },
                    fontFamily: {
                        display: ['Teko', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gymDark text-gray-200 font-sans p-4 md:p-8">

<div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-end border-b-2 border-gray-800 pb-4">
        <div>
            <h1 class="text-5xl font-display font-bold text-white tracking-wide">PHYSIQUE<span class="text-volt">.ENGINE</span></h1>
            <p class="text-sm text-gray-400 uppercase font-semibold tracking-wider">Target: 80KG | Timeline: Active</p>
        </div>
        <div class="text-right">
            <p class="text-3xl font-display font-bold text-neonBlue">84.2 KG</p>
            <p class="text-xs text-gray-500 uppercase">Current Weight</p>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-gymPanel rounded-xl p-6 border border-gray-800 shadow-lg">
            <h2 class="text-2xl font-display font-bold text-white mb-4">FUEL INTAKE</h2>
            
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-bold text-gray-300">CALORIES</span>
                        <span class="text-volt">1850 / 2000 kcal</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-3">
                        <div class="bg-volt h-3 rounded-full" style="width: 92%"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-bold text-gray-300">PROTEIN</span>
                        <span class="text-neonBlue">145 / 160g</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-3">
                        <div class="bg-neonBlue h-3 rounded-full" style="width: 90%"></div>
                    </div>
                </div>
            </div>

            <button class="mt-6 w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 rounded uppercase text-sm transition-colors">
                + Log Meal
            </button>
        </div>

        <div class="bg-gymPanel rounded-xl p-6 border border-gray-800 shadow-lg lg:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-display font-bold text-white">DAILY PROTOCOL EXECUTION</h2>
                <span class="bg-gray-800 text-volt text-xs px-2 py-1 rounded font-bold">2/4 COMPLETED</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <label class="flex items-center p-4 bg-gray-900 rounded-lg border border-gray-700 cursor-pointer hover:border-volt transition-colors">
                    <input type="checkbox" checked class="w-6 h-6 text-volt bg-gray-800 border-gray-600 rounded focus:ring-volt">
                    <span class="ml-3 text-lg font-bold text-white uppercase">Weight Training</span>
                </label>

                <label class="flex items-center p-4 bg-gray-900 rounded-lg border border-gray-700 cursor-pointer hover:border-volt transition-colors">
                    <input type="checkbox" class="w-6 h-6 text-volt bg-gray-800 border-gray-600 rounded focus:ring-volt">
                    <span class="ml-3 text-lg font-bold text-gray-400 uppercase">5KM Run (1/2 this week)</span>
                </label>

                <label class="flex items-center p-4 bg-gray-900 rounded-lg border border-gray-700 cursor-pointer hover:border-volt transition-colors">
                    <input type="checkbox" checked class="w-6 h-6 text-volt bg-gray-800 border-gray-600 rounded focus:ring-volt">
                    <span class="ml-3 text-lg font-bold text-white uppercase">5g Creatine</span>
                </label>

                <label class="flex items-center p-4 bg-gray-900 rounded-lg border border-gray-700 cursor-pointer hover:border-volt transition-colors">
                    <input type="checkbox" class="w-6 h-6 text-volt bg-gray-800 border-gray-600 rounded focus:ring-volt">
                    <span class="ml-3 text-lg font-bold text-gray-400 uppercase">10,000 Steps</span>
                </label>
            </div>
        </div>
    </div>

    <div class="bg-gymPanel rounded-xl p-6 border border-gray-800 shadow-lg">
        <h2 class="text-2xl font-display font-bold text-white mb-4">TRAJECTORY FORECAST</h2>
        <div class="h-64 flex items-center justify-center bg-gray-900 border border-gray-800 rounded-lg">
            <p class="text-gray-500 font-bold uppercase tracking-widest">[ Chart.js Canvas Goes Here ]</p>
        </div>
    </div>
</div>

</body>
</html>
